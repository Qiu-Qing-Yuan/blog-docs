backend:
  name: github
  repo: Qiu-Qing-Yuan/blog-docs
  branch: main
  base_url: https://decap-oauth.qiuqingyuan1127.workers.dev

# 本地开发时使用（无需 GitHub 认证）
local_backend: true

# 站点基础路径
site_url: https://qiu-qing-yuan.github.io/blog-docs/
display_url: https://qiu-qing-yuan.github.io/blog-docs/

# 媒体文件配置
media_folder: "docs/.vuepress/public/images/uploads"
public_folder: "/blog-docs/images/uploads"

# 搜索
search: true

# 国际化
locale: 'zh-hans'

collections:
  # ── 分类管理 ──
  - name: "categories"
    label: "分类管理"
    folder: "docs/posts/_categories"
    path: "{{slug}}"
    create: true
    delete: true
    summary: "{{name}} {{description}}"
    description: "管理文章分类。新增分类后即可在文章中使用；删除分类前请确保没有文章引用。"
    sortable_fields: ["name", "order"]
    view_filters:
      - label: "有图标"
        field: "icon"
        pattern: ".+"
    fields:
      - { label: "分类名称", name: "name", widget: "string", pattern: [".{1,}", "分类名不能为空"], hint: "与文章 frontmatter 中的 category 值一致，修改后需同步修改引用该分类的文章" }
      - { label: "分类描述", name: "description", widget: "string", hint: "简短描述该分类的主题，会显示在分类列表中" }
      - label: "外观设置"
        name: "appearance"
        widget: "object"
        collapsed: false
        fields:
          - label: "图标"
            name: "icon"
            widget: "select"
            required: false
            options:
              - { label: "🤖 机器人", value: "RobotOutlined" }
              - { label: "📝 翻译", value: "TranslationOutlined" }
              - { label: "☁️ 云服务", value: "CloudServerOutlined" }
              - { label: "☕ 咖啡", value: "CoffeeOutlined" }
              - { label: "🐧 Linux", value: "LinuxOutlined" }
              - { label: "🌐 全球", value: "GlobalOutlined" }
              - { label: "💻 代码", value: "CodeOutlined" }
              - { label: "🔌 接口", value: "ApiOutlined" }
              - { label: "🗄️ 数据库", value: "DatabaseOutlined" }
              - { label: "⚙️ 设置", value: "SettingOutlined" }
              - { label: "🔗 链接", value: "LinkOutlined" }
              - { label: "📦 更多", value: "EllipsisOutlined" }
              - { label: "🚀 火箭", value: "RocketOutlined" }
              - { label: "📊 图表", value: "BarChartOutlined" }
              - { label: "🔬 实验", value: "ExperimentOutlined" }
              - { label: "📚 书本", value: "ReadOutlined" }
              - { label: "🎨 调色", value: "BgColorsOutlined" }
              - { label: "🛡️ 安全", value: "SafetyOutlined" }
            hint: "选择一个代表该分类的图标"
          - label: "颜色"
            name: "color"
            widget: "select"
            default: "#1a5c3a"
            options:
              - { label: "🟢 学术绿", value: "#1a5c3a" }
              - { label: "🔵 科技蓝", value: "#2d8cf0" }
              - { label: "🔴 警示红", value: "#f5222d" }
              - { label: "🟠 活力橙", value: "#f89820" }
              - { label: "🟡 明亮黄", value: "#fcc624" }
              - { label: "🟣 紫罗兰", value: "#722ed1" }
              - { label: "🩵 青碧", value: "#13c2c2" }
              - { label: "💚 翠绿", value: "#52c41a" }
              - { label: "🩷 珊瑚", value: "#eb2f96" }
              - { label: "⚫ 深灰", value: "#8c8c8c" }
              - { label: "🔷 Docker蓝", value: "#0db7ed" }
              - { label: "🟧 Java橙", value: "#f89820" }
              - { label: "🌿 Node绿", value: "#68a063" }
              - { label: "💚 Nuxt绿", value: "#00dc82" }
              - { label: "🔥 热情红", value: "#c0392b" }
              - { label: "🌊 海洋蓝", value: "#2980b9" }
            hint: "选择分类的主题色"
      - { label: "排序权重", name: "order", widget: "number", value_type: "int", min: 0, max: 100, default: 0, hint: "数字越小越靠前，0 表示默认排序" }
      - { label: "详细说明", name: "body", widget: "markdown", required: false, hint: "可选，用于记录分类的详细说明" }

  # ── 标签管理 ──
  - name: "tags"
    label: "标签管理"
    folder: "docs/posts/_tags"
    path: "{{slug}}"
    create: true
    delete: true
    summary: "{{name}} {{description}}"
    description: "管理文章标签。新增标签后即可在文章中使用；删除标签前请确保没有文章引用。"
    sortable_fields: ["name"]
    fields:
      - { label: "标签名称", name: "name", widget: "string", pattern: [".{1,}", "标签名不能为空"], hint: "与文章 frontmatter 中的 tag 值一致，修改后需同步修改引用该标签的文章" }
      - { label: "标签描述", name: "description", widget: "string", hint: "简短描述该标签的含义" }
      - label: "标签颜色"
        name: "color"
        widget: "select"
        default: "#1a5c3a"
        options:
          - { label: "🟢 学术绿", value: "#1a5c3a" }
          - { label: "🔵 科技蓝", value: "#2d8cf0" }
          - { label: "🔴 警示红", value: "#f5222d" }
          - { label: "🟠 活力橙", value: "#f89820" }
          - { label: "🟡 明亮黄", value: "#fcc624" }
          - { label: "🟣 紫罗兰", value: "#722ed1" }
          - { label: "🩵 青碧", value: "#13c2c2" }
          - { label: "💚 翠绿", value: "#52c41a" }
          - { label: "🩷 珊瑚", value: "#eb2f96" }
          - { label: "⚫ 深灰", value: "#8c8c8c" }
          - { label: "🔷 Docker蓝", value: "#0db7ed" }
          - { label: "🌿 Node绿", value: "#68a063" }
          - { label: "💚 Nuxt绿", value: "#00dc82" }
          - { label: "🔥 热情红", value: "#c0392b" }
          - { label: "🌊 海洋蓝", value: "#2980b9" }
          - { label: "🔶 GitHub深", value: "#24292e" }
          - { label: "🔵 Algolia蓝", value: "#5468ff" }
        hint: "选择标签的主题色"
      - { label: "详细说明", name: "body", widget: "markdown", required: false, hint: "可选，用于记录标签的详细说明" }

  # ── 论文笔记 ──
  - name: "paper"
    label: "论文笔记"
    folder: "docs/posts/ai"
    path: "{{slug}}"
    create: true
    nested:
      depth: 2
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string", pattern: [".{2,}", "标题至少2个字符"] }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - label: "论文信息"
        name: "paper"
        widget: "object"
        collapsed: false
        fields:
          - { label: "论文标题", name: "title", widget: "string" }
          - { label: "作者", name: "authors", widget: "string", hint: "多作者用逗号分隔" }
          - { label: "会议/期刊", name: "venue", widget: "string", hint: "如 NeurIPS, ICML, ACL, CVPR" }
          - { label: "年份", name: "year", widget: "number", value_type: "int", min: 1990, max: 2030 }
          - { label: "PDF 链接", name: "pdf", widget: "string", required: false, hint: "arXiv 或其他 PDF 链接" }
          - { label: "代码链接", name: "code", widget: "string", required: false, hint: "GitHub 仓库链接" }
      - { label: "难度 (1-5)", name: "difficulty", widget: "number", min: 1, max: 5, default: 3, hint: "1=入门, 5=前沿" }
      - { label: "推荐度 (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5, hint: "1=一般, 5=必读" }
      - { label: "分类", name: "category", widget: "list", default: ["AI"], hint: "如 AI, NLP, CV, ML" }
      - { label: "标签", name: "tag", widget: "list", hint: "如 Transformer, Attention, 深度学习" }
      - { label: "封面图", name: "image", widget: "image", required: false, media_library: { config: { multiple: false } } }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10, hint: "0=不置顶" }
      - { label: "正文", name: "body", widget: "markdown", buttons: ["bold", "italic", "code", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"] }

  # ── 普通文章 ──
  - name: "devops"
    label: "运维笔记"
    folder: "docs/posts/devops"
    path: "{{slug}}"
    create: true
    nested:
      depth: 2
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["运维"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "linux"
    label: "Linux"
    folder: "docs/posts/linux"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["linux"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "other"
    label: "其他文章"
    folder: "docs/posts/other"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["其他"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "design-pattern"
    label: "设计模式"
    folder: "docs/posts/design-pattern"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["设计模式"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "mysql"
    label: "MySQL"
    folder: "docs/posts/mysql"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["MySQL"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "node"
    label: "Node.js"
    folder: "docs/posts/node"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["Node.js"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "nuxt"
    label: "Nuxt"
    folder: "docs/posts/nuxt"
    path: "{{slug}}"
    create: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "分类", name: "category", widget: "list", default: ["Nuxt"] }
      - { label: "标签", name: "tag", widget: "list" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "置顶优先级", name: "sticky", widget: "number", required: false, value_type: "int", min: 0, max: 10 }
      - { label: "正文", name: "body", widget: "markdown" }

  # ── 首页配置 ──
  - name: "settings"
    label: "站点设置"
    files:
      - name: "homepage"
        label: "首页配置"
        file: "docs/README.md"
        fields:
          - { label: "英雄文案", name: "heroText", widget: "list", hint: "打字机效果文案列表" }
          - { label: "副标题", name: "tagline", widget: "string" }
          - { label: "个人简介", name: "summary", widget: "string" }
          - { label: "研究方向", name: "hobby", widget: "list" }
          - { label: "背景图片", name: "bgImage", widget: "list" }
          - { label: "显示气泡", name: "bubbles", widget: "boolean", default: true }
          - { label: "显示箭头", name: "showArrow", widget: "boolean", default: true }

      - name: "profile"
        label: "个人信息"
        file: "docs/profile.yml"
        fields:
          - { label: "昵称", name: "author", widget: "string" }
          - { label: "头像", name: "authorAvatar", widget: "image", media_library: { config: { multiple: false } } }
          - { label: "座右铭", name: "motto", widget: "string", required: false }
          - label: "社交链接"
            name: "socialLinks"
            widget: "list"
            allow_add: true
            fields:
              - { label: "名称", name: "name", widget: "string" }
              - { label: "图标", name: "icon", widget: "string", hint: "Ant Design 图标名称，如 GithubOutlined" }
              - { label: "链接", name: "link", widget: "string" }
              - { label: "颜色", name: "color", widget: "color", required: false }
