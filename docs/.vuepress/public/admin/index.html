<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>博客管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #fff;
      --border: #e8ecf0;
      --text: #1a1a2e;
      --text-secondary: #5a5a72;
      --text-muted: #9494a8;
      --green: #1a5c3a;
      --green-light: rgba(26,92,58,0.06);
      --blue: #2d8cf0;
      --orange: #c9963b;
      --purple: #a371f7;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); }

    /* ── Top Navigation ── */
    .admin-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .nav-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--green), #4eca8a);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #fff; font-weight: 700;
    }
    .nav-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-link:hover { background: var(--green-light); color: var(--green); }
    .nav-link.active { background: var(--green-light); color: var(--green); font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-btn {
      padding: 7px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer; text-decoration: none;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .nav-btn:hover { border-color: var(--green); color: var(--green); }

    /* ── Dashboard (hidden when CMS is active) ── */
    .dashboard { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .dashboard.hidden { display: none; }
    .dash-header { margin-bottom: 28px; }
    .dash-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .dash-header p { font-size: 13px; color: var(--text-muted); }

    /* ── Quick Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--green); box-shadow: 0 4px 12px rgba(26,92,58,0.08); }
    .stat-card .label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--green); line-height: 1; }
    .stat-card .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* ── Quick Actions ── */
    .actions-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px; margin-bottom: 28px;
    }
    .action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
      display: flex; align-items: center; gap: 14px;
    }
    .action-card:hover { border-color: var(--green); box-shadow: 0 4px 12px rgba(26,92,58,0.08); transform: translateY(-1px); }
    .action-card .icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .action-card .icon.green { background: rgba(26,92,58,0.08); }
    .action-card .icon.blue { background: rgba(45,140,240,0.08); }
    .action-card .icon.orange { background: rgba(201,150,59,0.08); }
    .action-card .icon.purple { background: rgba(163,113,247,0.08); }
    .action-card .text h3 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .action-card .text p { font-size: 12px; color: var(--text-muted); }

    /* ── Recent Activity ── */
    .activity-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .activity-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .activity-header h2 { font-size: 14px; font-weight: 700; }
    .activity-list { max-height: 300px; overflow-y: auto; }
    .activity-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.03);
      display: flex; align-items: center; gap: 12px;
      font-size: 13px;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .activity-item .dot.green { background: var(--green); }
    .activity-item .dot.blue { background: var(--blue); }
    .activity-item .dot.orange { background: var(--orange); }
    .activity-item .dot.purple { background: var(--purple); }
    .activity-item .info { flex: 1; color: var(--text-secondary); }
    .activity-item .time { font-size: 11px; color: var(--text-muted); font-family: monospace; }

    /* ── Taxonomy Preview (CMS) ── */
    .taxonomy-preview { padding: 20px; font-family: var(--font); }
    .taxonomy-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 12px; border: 1px solid #e8e8e8; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .taxonomy-card .icon-circle { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex-shrink: 0; }
    .taxonomy-card .info { flex: 1; }
    .taxonomy-card .info h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: #1a1a2e; }
    .taxonomy-card .info p { margin: 0; font-size: 13px; color: #666; }
    .taxonomy-card .order-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; }
    .nc-listItem-card { border-radius: 8px !important; }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="admin-nav">
    <div class="nav-left">
      <div class="nav-logo">D</div>
      <span class="nav-title">管理后台</span>
      <div class="nav-links">
        <a href="#" class="nav-link active" id="navDashboard" onclick="showDashboard()">
          <span>📊</span> 概览
        </a>
        <a href="#" class="nav-link" id="navCms" onclick="showCms()">
          <span>📝</span> 内容管理
        </a>
        <a href="https://blog-storage-six.vercel.app/ui" target="_blank" class="nav-link">
          <span>💬</span> 评论管理
        </a>
        <a href="stats.html" class="nav-link">
          <span>📈</span> 访问统计
        </a>
        <a href="/blog-docs/" class="nav-link">
          <span>🌐</span> 返回站点
        </a>
      </div>
    </div>
  </nav>

  <!-- Dashboard Overview -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>博客管理概览</h1>
      <p>管理文章、分类、标签、评论和个人信息</p>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">文章总数</div>
        <div class="value" id="statArticles">-</div>
        <div class="sub">posts</div>
      </div>
      <div class="stat-card">
        <div class="label">分类数量</div>
        <div class="value" id="statCategories">-</div>
        <div class="sub">categories</div>
      </div>
      <div class="stat-card">
        <div class="label">标签数量</div>
        <div class="value" id="statTags">-</div>
        <div class="sub">tags</div>
      </div>
      <div class="stat-card">
        <div class="label">总浏览量</div>
        <div class="value" id="statViews">-</div>
        <div class="sub">pageviews</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-title">快速操作</div>
    <div class="actions-grid">
      <a href="#" class="action-card" onclick="showCms()">
        <div class="icon green">📝</div>
        <div class="text">
          <h3>内容管理</h3>
          <p>管理文章、分类、标签</p>
        </div>
      </a>
      <a href="https://blog-storage-six.vercel.app/ui" target="_blank" class="action-card">
        <div class="icon blue">💬</div>
        <div class="text">
          <h3>评论管理</h3>
          <p>审核、回复评论</p>
        </div>
      </a>
      <a href="stats.html" class="action-card">
        <div class="icon orange">📈</div>
        <div class="text">
          <h3>访问统计</h3>
          <p>查看详细访问数据</p>
        </div>
      </a>
      <a href="/blog-docs/timeline/" class="action-card">
        <div class="icon purple">🕐</div>
        <div class="text">
          <h3>更新时间轴</h3>
          <p>查看网站变更记录</p>
        </div>
      </a>
    </div>

    <!-- Recent Activity -->
    <div class="activity-section">
      <div class="activity-header">
        <h2>最近更新</h2>
        <a href="/blog-docs/timeline/" style="font-size:12px; color:var(--green); text-decoration:none; font-weight:600;">查看全部 →</a>
      </div>
      <div class="activity-list" id="activityList">
        <div class="activity-item"><span class="info">加载中...</span></div>
      </div>
    </div>
  </div>

  <!-- CMS Container (hidden by default) -->
  <div id="cmsContainer" style="display:none">
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </div>

  <script>
    // ── Dashboard Logic ──
    let cmsLoaded = false

    function showDashboard() {
      document.getElementById('dashboard').classList.remove('hidden')
      document.getElementById('cmsContainer').style.display = 'none'
      document.getElementById('navDashboard').classList.add('active')
      document.getElementById('navCms').classList.remove('active')
    }

    function showCms() {
      document.getElementById('dashboard').classList.add('hidden')
      document.getElementById('cmsContainer').style.display = 'block'
      document.getElementById('navDashboard').classList.remove('active')
      document.getElementById('navCms').classList.add('active')
      if (!cmsLoaded) {
        cmsLoaded = true
        // Load CMS script dynamically
        const script = document.createElement('script')
        script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js'
        script.onload = () => initCms()
        document.getElementById('cmsContainer').appendChild(script)
      }
    }

    // ── CMS Initialization ──
    function initCms() {
      if (typeof CMS === 'undefined') return

      CMS.registerLocale('zh-hans', {
        app: { header: { content: '内容', search: '搜索', logout: '退出' }, appError: { config: '配置错误' }, notFoundPage: { document: '页面未找到' } },
        collection: {
          sidebar: { collections: '内容集合', searchAll: '搜索全部', searchResults: '搜索结果' },
          entries: { loadingEntries: '加载中…', cachingEntries: '缓存中…', longerLoading: '首次加载可能较慢' },
          editor: {
            editorControl: { field: { optional: '可选' } },
            editorControlPane: { widget: { required: '必填', regexPattern: '格式不匹配', processing: '处理中…' } },
            editor: { onFailToPersist: '保存失败：', onFailToPublish: '发布失败：', saving: '保存中…', save: '保存', deleting: '删除中…', publish: '发布', unpublishedDraft: '未发布草稿', published: '已发布', unpublishedChanges: '未发布更改' },
          },
        },
        ui: { default: { goBackToSite: '返回站点' }, errorBoundary: { title: '错误', details: '发生错误，请', reportIt: '报告问题', detailsHeading: '详细信息', recoveredEntry: { entry: '恢复的内容', recover: '恢复' } } },
      })

      // Preview templates
      const iconMap = {
        'RobotOutlined': '🤖', 'TranslationOutlined': '📝', 'CloudServerOutlined': '☁️',
        'CoffeeOutlined': '☕', 'LinuxOutlined': '🐧', 'GlobalOutlined': '🌐',
        'CodeOutlined': '💻', 'ApiOutlined': '🔌', 'DatabaseOutlined': '🗄️',
        'SettingOutlined': '⚙️', 'LinkOutlined': '🔗', 'EllipsisOutlined': '📦',
        'RocketOutlined': '🚀', 'BarChartOutlined': '📊', 'ExperimentOutlined': '🔬',
        'ReadOutlined': '📚', 'BgColorsOutlined': '🎨', 'SafetyOutlined': '🛡️'
      }

      CMS.registerPreviewTemplate('categories', ({ entry }) => {
        const name = entry.getIn(['data', 'name']) || ''
        const desc = entry.getIn(['data', 'description']) || ''
        const icon = entry.getIn(['data', 'appearance', 'icon']) || ''
        const color = entry.getIn(['data', 'appearance', 'color']) || '#1a5c3a'
        const order = entry.getIn(['data', 'order']) || 0
        const emoji = iconMap[icon] || '📁'
        return h('div', { className: 'taxonomy-preview' },
          h('div', { className: 'taxonomy-card' },
            h('div', { className: 'icon-circle', style: { background: color } }, emoji),
            h('div', { className: 'info' }, h('h3', null, name), h('p', null, desc)),
            h('span', { className: 'order-badge', style: { background: color } }, `#${order}`)
          )
        )
      })

      CMS.registerPreviewTemplate('tags', ({ entry }) => {
        const name = entry.getIn(['data', 'name']) || ''
        const desc = entry.getIn(['data', 'description']) || ''
        const color = entry.getIn(['data', 'color']) || '#1a5c3a'
        return h('div', { className: 'taxonomy-preview' },
          h('div', { className: 'taxonomy-card' },
            h('div', { className: 'icon-circle', style: { background: color } }, '🏷️'),
            h('div', { className: 'info' }, h('h3', null, name), h('p', null, desc)),
            h('span', { className: 'order-badge', style: { background: color } }, name)
          )
        )
      })

      // Deletion protection
      const CATEGORY_PATH = 'docs/posts/_categories/'
      const TAG_PATH = 'docs/posts/_tags/'
      const ARTICLE_DIRS = ['docs/posts/ai/', 'docs/posts/devops/', 'docs/posts/linux/',
        'docs/posts/other/', 'docs/posts/design-pattern/', 'docs/posts/mysql/',
        'docs/posts/node/', 'docs/posts/nuxt/']

      function isDeleting(entry) { return entry && entry.get('isDeleting') === true }

      async function hasArticlesReferencing(type, name) {
        const entries = await Promise.all(ARTICLE_DIRS.map(dir => CMS.backend.entriesByFolder(dir).catch(() => [])))
        const allArticles = entries.flat()
        return allArticles.some(article => {
          const fm = article.data || {}
          if (type === 'category') { const cats = fm.category || []; return Array.isArray(cats) ? cats.includes(name) : cats === name }
          else { const tags = fm.tag || []; return Array.isArray(tags) ? tags.includes(name) : tags === name }
        })
      }

      CMS.registerEventListener({
        name: 'preSave',
        handler: async ({ entry }) => {
          const path = entry.get('path') || ''
          if (path.startsWith(CATEGORY_PATH)) {
            const name = entry.getIn(['data', 'name'])
            if (name && isDeleting(entry)) {
              const inUse = await hasArticlesReferencing('category', name)
              if (inUse) throw new Error(`无法删除分类「${name}」：仍有文章使用此分类。请先修改相关文章的分类后再删除。`)
            }
          }
          if (path.startsWith(TAG_PATH)) {
            const name = entry.getIn(['data', 'name'])
            if (name && isDeleting(entry)) {
              const inUse = await hasArticlesReferencing('tag', name)
              if (inUse) throw new Error(`无法删除标签「${name}」：仍有文章使用此标签。请先修改相关文章的标签后再删除。`)
            }
          }
        }
      })
    }

    // ── Load Stats ──
    async function loadStats() {
      try {
        const res = await fetch('/blog-docs/sitemap.xml')
        const text = await res.text()
        const xml = new DOMParser().parseFromString(text, 'text/xml')
        const paths = []
        xml.querySelectorAll('url > loc').forEach(url => {
          const path = url.textContent.replace(/^https?:\/\/[^/]+/, '')
          if (path.includes('/posts/') && path !== '/blog-docs/') paths.push(path)
        })
        document.getElementById('statArticles').textContent = paths.length

        let totalViews = 0
        for (let i = 0; i < Math.min(paths.length, 20); i += 5) {
          const batch = paths.slice(i, i + 5)
          const results = await Promise.all(batch.map(async p => {
            try {
              const r = await fetch(`https://blog-storage-six.vercel.app/article?path=${encodeURIComponent(p)}&lang=zh-CN`)
              const d = await r.json()
              return typeof d === 'number' ? d : 0
            } catch { return 0 }
          }))
          totalViews += results.reduce((s, v) => s + v, 0)
        }
        document.getElementById('statViews').textContent = totalViews > 0 ? totalViews.toLocaleString() : '0'
      } catch {
        document.getElementById('statArticles').textContent = '?'
        document.getElementById('statViews').textContent = '?'
      }

      try {
        const catRes = await fetch('/blog-docs/category/')
        const catText = await catRes.text()
        document.getElementById('statCategories').textContent = (catText.match(/<h3[^>]*>[^<]+<\/h3>/g) || []).length || '-'
      } catch { document.getElementById('statCategories').textContent = '-' }

      try {
        const tagRes = await fetch('/blog-docs/tag/')
        const tagText = await tagRes.text()
        document.getElementById('statTags').textContent = (tagText.match(/<h3[^>]*>[^<]+<\/h3>/g) || []).length || '-'
      } catch { document.getElementById('statTags').textContent = '-' }
    }

    // ── Load Recent Activity ──
    async function loadActivity() {
      try {
        const res = await fetch('/blog-docs/_temp/timeline.json')
        if (!res.ok) throw new Error('Failed')
        const data = await res.json()
        const all = [
          ...(data.site || []).map(i => ({ ...i, type: 'site' })),
          ...(data.post || []).map(i => ({ ...i, type: 'post' })),
          ...(data.taxonomy || []).map(i => ({ ...i, type: 'taxonomy' })),
          ...(data.settings || []).map(i => ({ ...i, type: 'settings' })),
        ].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 15)

        const dotColor = { site: 'green', post: 'blue', taxonomy: 'orange', settings: 'purple' }
        const list = document.getElementById('activityList')
        if (!all.length) {
          list.innerHTML = '<div class="activity-item"><span class="info">暂无更新记录</span></div>'
          return
        }
        list.innerHTML = all.map(item => `
          <div class="activity-item">
            <span class="dot ${dotColor[item.type] || 'green'}"></span>
            <span class="info">${item.icon} ${item.title}</span>
            <span class="time">${item.date}</span>
          </div>
        `).join('')
      } catch {
        document.getElementById('activityList').innerHTML = '<div class="activity-item"><span class="info">暂无更新记录</span></div>'
      }
    }

    loadStats()
    loadActivity()
  </script>
</body>
</html>

      'ReadOutlined': '📚', 'BgColorsOutlined': '🎨', 'SafetyOutlined': '🛡️'
    }

    CMS.registerPreviewTemplate('categories', ({ entry }) => {
      const name = entry.getIn(['data', 'name']) || ''
      const desc = entry.getIn(['data', 'description']) || ''
      const icon = entry.getIn(['data', 'appearance', 'icon']) || ''
      const color = entry.getIn(['data', 'appearance', 'color']) || '#1a5c3a'
      const order = entry.getIn(['data', 'order']) || 0
      const emoji = iconMap[icon] || '📁'
      return h('div', { className: 'taxonomy-preview' },
        h('div', { className: 'taxonomy-card' },
          h('div', { className: 'icon-circle', style: { background: color } }, emoji),
          h('div', { className: 'info' },
            h('h3', null, name),
            h('p', null, desc)
          ),
          h('span', { className: 'order-badge', style: { background: color } }, `#${order}`)
        )
      )
    })

    CMS.registerPreviewTemplate('tags', ({ entry }) => {
      const name = entry.getIn(['data', 'name']) || ''
      const desc = entry.getIn(['data', 'description']) || ''
      const color = entry.getIn(['data', 'color']) || '#1a5c3a'
      return h('div', { className: 'taxonomy-preview' },
        h('div', { className: 'taxonomy-card' },
          h('div', { className: 'icon-circle', style: { background: color } }, '🏷️'),
          h('div', { className: 'info' },
            h('h3', null, name),
            h('p', null, desc)
          ),
          h('span', { className: 'order-badge', style: { background: color } }, name)
        )
      )
    })

    // ── 分类/标签删除保护 ──
    // 拦截删除操作，检查是否仍有文章引用该分类/标签
    const CATEGORY_PATH = 'docs/posts/_categories/'
    const TAG_PATH = 'docs/posts/_tags/'
    const ARTICLE_DIRS = ['docs/posts/ai/', 'docs/posts/devops/', 'docs/posts/linux/',
      'docs/posts/other/', 'docs/posts/design-pattern/', 'docs/posts/mysql/',
      'docs/posts/node/', 'docs/posts/nuxt/']

    function isDeleting(entry) {
      return entry && entry.get('isDeleting') === true
    }

    async function hasArticlesReferencing(type, name) {
      const entries = await Promise.all(
        ARTICLE_DIRS.map(dir =>
          CMS.backend.entriesByFolder(dir).catch(() => [])
        )
      )
      const allArticles = entries.flat()
      return allArticles.some(article => {
        const fm = article.data || {}
        if (type === 'category') {
          const cats = fm.category || []
          return Array.isArray(cats) ? cats.includes(name) : cats === name
        } else {
          const tags = fm.tag || []
          return Array.isArray(tags) ? tags.includes(name) : tags === name
        }
      })
    }

    CMS.registerEventListener({
      name: 'preSave',
      handler: async ({ entry }) => {
        const path = entry.get('path') || ''
        if (path.startsWith(CATEGORY_PATH)) {
          const name = entry.getIn(['data', 'name'])
          if (name && isDeleting(entry)) {
            const inUse = await hasArticlesReferencing('category', name)
            if (inUse) {
              throw new Error(`无法删除分类「${name}」：仍有文章使用此分类。请先修改相关文章的分类后再删除。`)
            }
          }
        }
        if (path.startsWith(TAG_PATH)) {
          const name = entry.getIn(['data', 'name'])
          if (name && isDeleting(entry)) {
            const inUse = await hasArticlesReferencing('tag', name)
            if (inUse) {
              throw new Error(`无法删除标签「${name}」：仍有文章使用此标签。请先修改相关文章的标签后再删除。`)
            }
          }
        }
      }
    })
  </script>
</body>
</html>
