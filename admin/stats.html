<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据观测站 - 博客管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #06080f;
      --bg-surface: #0d1117;
      --bg-card: #161b22;
      --bg-elevated: #1c2128;
      --border-subtle: rgba(255,255,255,0.06);
      --border-accent: rgba(26,92,58,0.3);
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --green: #1a5c3a;
      --green-bright: #4eca8a;
      --green-glow: rgba(78,202,138,0.15);
      --blue: #2d8cf0;
      --orange: #c9963b;
      --purple: #a371f7;
      --red: #f85149;
      --font-ui: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Playfair Display', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26,92,58,0.08), transparent),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(45,140,240,0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }
    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,8,15,0.8);
      backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 32px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--green), var(--green-bright));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; font-weight: 700;
      box-shadow: 0 0 20px var(--green-glow);
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--green-bright), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-link {
      color: var(--text-secondary); text-decoration: none; font-size: 13px;
      font-weight: 500; transition: color 0.2s;
    }
    .header-link:hover { color: var(--green-bright); }
    .btn-refresh {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      color: var(--text-primary); padding: 7px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600; font-family: var(--font-ui);
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-refresh:hover { border-color: var(--green); background: var(--green-glow); }
    .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-refresh .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green-bright);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(78,202,138,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(78,202,138,0); }
    }

    /* ── Layout ── */
    .container { max-width: 1280px; margin: 0 auto; padding: 28px 32px; position: relative; z-index: 1; }

    /* ── Login Hint ── */
    .login-hint {
      background: rgba(201,150,59,0.08);
      border: 1px solid rgba(201,150,59,0.2);
      border-radius: 10px; padding: 14px 18px;
      margin-bottom: 24px; font-size: 13px; color: var(--orange);
      display: flex; align-items: center; gap: 10px;
    }
    .login-hint a { color: var(--green-bright); font-weight: 600; }
    .login-hint a:hover { text-decoration: underline; }

    /* ── Stat Cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 20px;
      position: relative; overflow: hidden;
      transition: all 0.3s ease;
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .stat-card:hover { border-color: var(--border-accent); transform: translateY(-2px); }
    .stat-card:hover::before { opacity: 1; }
    .stat-card .icon-ring {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; margin-bottom: 14px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
    }
    .stat-card .label {
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-family: var(--font-mono);
      font-size: 32px; font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-card .sub {
      font-size: 11px; color: var(--text-muted);
      margin-top: 6px; font-family: var(--font-mono);
    }
    .stat-card.green { --accent: var(--green-bright); --accent-bg: rgba(78,202,138,0.08); --accent-border: rgba(78,202,138,0.15); }
    .stat-card.blue { --accent: var(--blue); --accent-bg: rgba(45,140,240,0.08); --accent-border: rgba(45,140,240,0.15); }
    .stat-card.orange { --accent: var(--orange); --accent-bg: rgba(201,150,59,0.08); --accent-border: rgba(201,150,59,0.15); }
    .stat-card.purple { --accent: var(--purple); --accent-bg: rgba(163,113,247,0.08); --accent-border: rgba(163,113,247,0.15); }

    /* ── Section ── */
    .section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .section-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-title {
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green-bright);
      box-shadow: 0 0 8px var(--green-glow);
    }
    .badge {
      background: var(--green-glow);
      color: var(--green-bright);
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      font-family: var(--font-mono);
      border: 1px solid rgba(78,202,138,0.2);
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 20px;
      font-size: 11px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky; top: 0;
    }
    td {
      padding: 13px 20px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      vertical-align: middle;
    }
    tr { transition: background 0.15s; }
    tr:hover { background: rgba(78,202,138,0.03); }
    tr:last-child td { border-bottom: none; }

    .rank {
      font-family: var(--font-mono); font-weight: 700; font-size: 12px;
      width: 28px; height: 28px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .rank.top { background: var(--green-glow); color: var(--green-bright); }
    .rank.normal { color: var(--text-muted); }
    .page-path {
      font-family: var(--font-mono); font-size: 12px;
      color: var(--green-bright); opacity: 0.8;
    }
    .views-cell {
      font-family: var(--font-mono); font-weight: 700; font-size: 14px;
      color: var(--blue);
    }
    .views-bar {
      display: inline-block; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      margin-left: 8px; vertical-align: middle;
      transition: width 0.6s ease;
    }
    .nick { font-weight: 600; color: var(--text-primary); }
    .content-preview {
      max-width: 280px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      color: var(--text-secondary); font-size: 12px;
    }
    .ip {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--purple);
      background: rgba(163,113,247,0.08);
      padding: 3px 8px; border-radius: 6px;
      border: 1px solid rgba(163,113,247,0.15);
    }
    .ua {
      font-size: 11px; color: var(--text-muted);
      max-width: 200px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .time {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-muted);
    }
    .comment-url {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--green-bright); opacity: 0.6;
      max-width: 150px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Loading / Empty ── */
    .loading-cell {
      text-align: center; padding: 48px 20px;
      color: var(--text-muted); font-size: 13px;
    }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid var(--border-subtle);
      border-top-color: var(--green-bright);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 10px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-cell {
      text-align: center; padding: 48px 20px;
      color: var(--text-muted); font-size: 13px;
    }
    .empty-cell a { color: var(--green-bright); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Table wrapper ── */
    .table-wrap { overflow-x: auto; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.5s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }
    .delay-4 { animation-delay: 0.4s; opacity: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-logo">D</div>
      <span class="header-title">Data Observatory</span>
    </div>
    <div class="header-right">
      <button class="btn-refresh" onclick="init()" id="refreshAll">
        <span class="dot"></span>
        刷新数据
      </button>
      <a href="/blog-docs/admin/" class="header-link">管理后台</a>
      <a href="/blog-docs/" class="header-link">返回站点</a>
    </div>
  </div>

  <div class="container">
    <div class="login-hint" id="loginHint">
      <span style="font-size:16px">⚡</span>
      <span>详细访客信息（IP、浏览器等）需要先
        <a href="https://blog-storage-six.vercel.app/ui" target="_blank">登录 Waline 管理后台</a>
        ，登录后刷新此页面。
      </span>
    </div>

    <!-- ── Stat Cards ── -->
    <div class="stats-grid">
      <div class="stat-card green animate-in">
        <div class="icon-ring">📝</div>
        <div class="label">文章总数</div>
        <div class="value" id="totalArticles">-</div>
        <div class="sub">posts</div>
      </div>
      <div class="stat-card blue animate-in delay-1">
        <div class="icon-ring">👁️</div>
        <div class="label">总访问量</div>
        <div class="value" id="totalViews">-</div>
        <div class="sub">pageviews</div>
      </div>
      <div class="stat-card orange animate-in delay-2">
        <div class="icon-ring">💬</div>
        <div class="label">总评论数</div>
        <div class="value" id="totalComments">-</div>
        <div class="sub">comments</div>
      </div>
      <div class="stat-card purple animate-in delay-3">
        <div class="icon-ring">📂</div>
        <div class="label">分类数量</div>
        <div class="value" id="totalTaxonomy">-</div>
        <div class="sub">categories</div>
      </div>
    </div>

    <!-- ── Pageview Ranking ── -->
    <div class="section animate-in delay-3">
      <div class="section-header">
        <div class="section-title">
          <span class="dot"></span>
          文章访问排行
        </div>
        <button class="btn-refresh" onclick="loadPageviews()" id="pvBtn">
          <span class="dot"></span>
          刷新
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:50px">#</th>
              <th>页面路径</th>
              <th style="width:160px">访问量</th>
            </tr>
          </thead>
          <tbody id="pageviewTable">
            <tr><td colspan="3" class="loading-cell"><span class="spinner"></span>加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── Comments ── -->
    <div class="section animate-in delay-4">
      <div class="section-header">
        <div class="section-title">
          <span class="dot"></span>
          最近评论
        </div>
        <span class="badge" id="commentCount">0</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>昵称</th>
              <th>评论内容</th>
              <th>IP 地址</th>
              <th>浏览器 / 系统</th>
              <th>页面</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody id="commentTable">
            <tr><td colspan="6" class="loading-cell"><span class="spinner"></span>加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const WALINE_SERVER = 'https://blog-storage-six.vercel.app/'
    const BASE_PATH = '/blog-docs/'
    const ARTICLE_PATHS = []

    function getWalineToken() { return localStorage.getItem('WALINE_TOKEN') || '' }

    async function loadArticles() {
      try {
        const res = await fetch(BASE_PATH + 'sitemap.xml')
        const text = await res.text()
        const xml = new DOMParser().parseFromString(text, 'text/xml')
        xml.querySelectorAll('url > loc').forEach(url => {
          const path = url.textContent.replace(/^https?:\/\/[^/]+/, '')
          if (path.includes('/posts/') && path !== BASE_PATH) ARTICLE_PATHS.push(path)
        })
        document.getElementById('totalArticles').textContent = ARTICLE_PATHS.length
      } catch { document.getElementById('totalArticles').textContent = '?' }
    }

    async function loadPageviews() {
      const btn = document.getElementById('pvBtn')
      btn.disabled = true
      const results = []
      let totalViews = 0
      for (let i = 0; i < ARTICLE_PATHS.length; i += 5) {
        const batch = ARTICLE_PATHS.slice(i, i + 5)
        const batchResults = await Promise.all(batch.map(async path => {
          try {
            const res = await fetch(`${WALINE_SERVER}article?path=${encodeURIComponent(path)}&lang=zh-CN`)
            const data = await res.json()
            const count = typeof data === 'number' ? data : (data?.data?.[0] || data?.count || 0)
            return { path, views: count }
          } catch { return { path, views: 0 } }
        }))
        results.push(...batchResults)
        totalViews += batchResults.reduce((s, r) => s + r.views, 0)
      }
      results.sort((a, b) => b.views - a.views)
      document.getElementById('totalViews').textContent = totalViews.toLocaleString()
      const maxViews = results[0]?.views || 1
      const tbody = document.getElementById('pageviewTable')
      if (!results.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-cell">暂无数据</td></tr>'
      } else {
        tbody.innerHTML = results.map((r, i) => {
          const barWidth = maxViews > 0 ? Math.max(4, (r.views / maxViews) * 100) : 0
          return `<tr>
            <td><span class="rank ${i < 3 ? 'top' : 'normal'}">${i + 1}</span></td>
            <td class="page-path">${r.path}</td>
            <td>
              <span class="views-cell">${r.views.toLocaleString()}</span>
              <span class="views-bar" style="width:${barWidth}px"></span>
            </td>
          </tr>`
        }).join('')
      }
      btn.disabled = false
    }

    async function loadComments() {
      const token = getWalineToken()
      const tbody = document.getElementById('commentTable')
      if (!token) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-cell">请先 <a href="https://blog-storage-six.vercel.app/ui" target="_blank">登录 Waline</a> 后刷新查看</td></tr>'
        return
      }
      try {
        const res = await fetch(`${WALINE_SERVER}api/comment?type=list&pageSize=50`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        if (!res.ok) throw new Error('Unauthorized')
        const data = await res.json()
        const comments = data.data || []
        document.getElementById('commentCount').textContent = comments.length
        document.getElementById('loginHint').style.display = 'none'
        if (!comments.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-cell">暂无评论</td></tr>'
        } else {
          tbody.innerHTML = comments.map(c => {
            const ts = c.insertedAt || c.created
            const time = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts)
            const timeStr = isNaN(time) ? '-' : time.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
            const content = (c.comment || '').replace(/<[^>]+>/g, '').slice(0, 80)
            return `<tr>
              <td class="nick">${c.nick || '匿名'}</td>
              <td class="content-preview" title="${content}">${content}</td>
              <td><span class="ip">${c.ip || '-'}</span></td>
              <td><span class="ua" title="${c.ua||c.userAgent||''}">${c.ua||c.userAgent||'-'}</span></td>
              <td class="comment-url">${c.url||'-'}</td>
              <td class="time">${timeStr}</td>
            </tr>`
          }).join('')
        }
      } catch {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-cell">登录已过期，请 <a href="https://blog-storage-six.vercel.app/ui" target="_blank">重新登录</a></td></tr>'
      }
    }

    async function loadTaxonomy() {
      try {
        const res = await fetch(BASE_PATH + 'category/')
        const text = await res.text()
        const count = (text.match(/<h3[^>]*>[^<]+<\/h3>/g) || []).length
        document.getElementById('totalTaxonomy').textContent = count || '-'
      } catch { document.getElementById('totalTaxonomy').textContent = '-' }
    }

    async function loadCommentCount() {
      try {
        let total = 0
        for (const path of ARTICLE_PATHS.slice(0, 20)) {
          try {
            const res = await fetch(`${WALINE_SERVER}comment?path=${encodeURIComponent(path)}&lang=zh-CN`)
            const data = await res.json()
            total += (data?.count || data?.data?.length || 0)
          } catch {}
        }
        document.getElementById('totalComments').textContent = total || '0'
      } catch { document.getElementById('totalComments').textContent = '-' }
    }

    async function init() {
      const btn = document.getElementById('refreshAll')
      btn.disabled = true
      await loadArticles()
      await Promise.all([loadPageviews(), loadComments(), loadTaxonomy(), loadCommentCount()])
      btn.disabled = false
    }
    init()
  </script>
</body>
</html>
